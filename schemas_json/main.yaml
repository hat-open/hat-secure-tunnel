$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "hat-iec62351-tunnel://main.yaml"
type: object
required:
    - mappings
properties:
    type:
        const: event
        description: configuration type identification
    version:
        type: string
        description: component version
    mappings:
        type: array
        minItems: 1
        items:
            $ref: "hat-iec62351-tunnel://main.yaml#/$defs/mapping"
$defs:
    mapping:
        type: object
        required:
            - server
            - client
        properties:
            server:
                $ref: "hat-iec62351-tunnel://main.yaml#/$defs/endpoint"
            client:
                $ref: "hat-iec62351-tunnel://main.yaml#/$defs/endpoint"
    endpoint:
        type: object
        required:
            - host
            - port
        properties:
            host:
                type: string
            port:
                type: integer
            ssl:
                type: object
                properties:
                    local_cert:
                        type: object
                        description: |
                            required in case of server endpoint
                        required:
                            - cert_path
                            - key_path
                        properties:
                            cert_path:
                                type: string
                            key_path:
                                type: string
                            password:
                                type: string
                    remote_cert:
                        type: object
                        required:
                            - ca_path
                        properties:
                            ca_path:
                                type: string
                            allowed_cert_sn:
                                type: array
                                items:
                                    type: string
                            max_cert_len:
                                type: integer
                                default: 8192
                            crl:
                                type: object
                                required:
                                    - path
                                properties:
                                    path:
                                        type: string
                                    update_interval:
                                        type: integer
                    renegotiate_interval:
                        type: integer
                    session_cache_timeout:
                        type: integer
